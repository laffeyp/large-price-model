[project]
name = "price-space-llm"
version = "0.1.0"
description = "Causal decoder transformer over multi-channel 15-min market state; 32-bucket vol-normalized forward return distribution; cost-aware simulator."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_space_llm"]

[tool.hatch.build.targets.wheel.force-include]
"sdd-kit-2/lib/sdd.py" = "sdd.py"
# signals/0.1.json ships automatically via the src/price_space_llm/_vocab/
# symlink discovered by [tool.hatch.build.targets.wheel] packages above.
# hatchling follows the symlink and copies the target's contents.

[tool.pytest.ini_options]
pythonpath = ["src", "sdd-kit-2/lib"]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sdd-kit-2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/price_space_llm"]

[[tool.mypy.overrides]]
module = "sdd"
ignore_missing_imports = true

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
